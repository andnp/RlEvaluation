[tool]
[tool.commitizen]
name = "cz_conventional_commits"
version = "1.1.2"
tag_format = "$version"
version_files = ["pyproject.toml"]

[tool.ruff.lint]
select = ['F', 'E', 'W', 'B']
ignore = ['E501', 'E701']

[tool.pyright]
include = ['rlevaluation', 'tests']
venvPath = '.'
venv = '.venv'
typeCheckingMode = 'standard'
useLibraryCodeForTypes = true

[tool.setuptools]
packages = ["rlevaluation"]

[project]
name = "rlevaluation"
version = "1.1.2"
description = ""
authors = [
    {name = "Andy Patterson", email = "andnpatterson@gmail.com"},
]
dependencies = [
    "polars~=1.39",
    "numba~=0.65",
    "numpy~=2.4",
    "scipy~=1.17",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

classifiers = [
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Homepage = "https://github.com/andnp/rlevaluation"
Documentation = "https://github.com/andnp/rlevaluation/blob/main/README.md"
Repository = "https://github.com/andnp/rlevaluation"
Issues = "https://github.com/andnp/rlevaluation/issues"
Changelog = "https://github.com/andnp/rlevaluation/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "commitizen>=4.13.10",
    "matplotlib>=3.10.8",
    "pip>=26.0.1",
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
